[workspace]
name = "robot-testbed"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[environments]
core = { features = ["build", "core", "test"], no-default-feature = true }
core-franka = { features = ["build", "core", "test", "franka"], no-default-feature = true }
ros2 = { features = ["build", "core", "test", "ros2", "policy"], no-default-feature = true }

[feature.franka.activation.env]
TESTBED_WITH_FRANKA = "1"

[feature.build.dependencies]
python = "3.12.*"
cmake = ">=3.20,<4"
cxx-compiler = "*"
ninja = "*"
make = "*"
pkg-config = "*"
git = "*"
vcstool = "*"
pip = "*"
setuptools = ">=77"

[feature.core.dependencies]
eigen = ">=3.4,<4"
orocos-kdl = "*"
pybind11 = ">=2.13,<4"
numpy = ">=1.26,<3"

[feature.core.pypi-dependencies]
testbed-input-core = { path = "src/input_devices", editable = true }

[feature.core.activation]
scripts = ["tools/activate_core.sh"]

[feature.test.dependencies]
pytest = ">=8,<9"
ruff = "==0.15.20"

[feature.core.tasks]
build-core = "bash tools/build_core.sh"

[feature.ros2]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.ros2.dependencies]
filelock = ">=3,<4"
colcon-common-extensions = "*"
ros-jazzy-ros-base = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-cmake-pytest = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-rosidl-default-runtime = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-generate-parameter-library = "*"
ros-jazzy-realtime-tools = "*"
ros-jazzy-ur-robot-driver = "*"
ros-jazzy-ur-description = "*"
ros-jazzy-cv-bridge = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-xacro = "*"
ros-jazzy-launch-testing = "*"
ros-jazzy-launch-xml = "*"
evdev = ">=2,<3"
inputs = "0.5.*"
libusb = ">=1,<2"
ros-jazzy-kdl-parser = ">=2.11.0,<3"

[feature.ros2.activation]
scripts = ["tools/activate_ros2.sh"]

[feature.ros2.tasks]
build = { cmd = "bash tools/build_ros2.sh", depends-on = ["build-core"] }
mock = "ros2 launch testbed_launchers mock.launch.py"
robot = "ros2 launch testbed_launchers ur5e_joint_rcm_controller.launch.py"
model = "ros2 launch input_translation model_pose_setter.launch.py"
record-ui = "python -m tso_sensorium.scripts.record_ui_ros2 --config_path configs/recording/tso_testbed_jazzy_ui.yaml --session.output_folder recordings"
camera-build = "pixi run --manifest-path src/endoscope_capture/pixi.toml --locked -e ros2 build-capture"
camera = "pixi run --manifest-path src/endoscope_capture/pixi.toml --locked -e ros2 capture frame_id:=endoscope/camera_optical_frame"

[feature.policy.dependencies]
opencv = ">=4.10,<5"
scipy = ">=1.11,<2"
pandas = ">=2,<3"
pyzmq = ">=25"
websockets = ">=10,<16"
flask = ">=3,<4"

[feature.policy.pypi-dependencies]
tso-sensorium = { path = "src/tso_sensorium", editable = true }
tso-robotics-sockets = { path = "src/tso_robotics_sockets", editable = true }
versatil-constants = { path = "src/versatil_constants", editable = true }
