[workspace]
name = "robot-testbed"
channels = ["https://prefix.dev/robostack-noetic", "conda-forge"]
platforms = ["linux-64"]

[environments]
ros1 = { features = ["ros1"], no-default-feature = true }

[feature.ros1.dependencies]
python = "3.11.*"
cmake = ">=3.20,<4"
cxx-compiler = "*"
make = "*"
ninja = "*"
pkg-config = "*"
patch = "*"
git = "*"
vcstool = "*"
catkin_tools = "*"
empy = ">=3.3.4,<4"
eigen = ">=3.4,<4"
libboost-devel = "*"
numpy = ">=1.26,<3"
opencv = ">=4.8,<5"
scipy = ">=1.11,<2"
pyzmq = ">=25"
websockets = ">=10,<16"
ros-noetic-ros-core = "*"
ros-noetic-ros-control = "*"
ros-noetic-ros-controllers = "*"
ros-noetic-cv-bridge = "*"
ros-noetic-message-generation = "*"
ros-noetic-message-runtime = "*"
ros-noetic-ur-msgs = "*"
ros-noetic-tf = "*"
ros-noetic-tf2-geometry-msgs = "*"
ros-noetic-tf2-eigen = "*"
ros-noetic-kdl-parser = "*"
ros-noetic-robot-state-publisher = "*"
ros-noetic-xacro = "*"
ros-noetic-rostest = "*"
flask = ">=3,<4"
evdev = ">=2.0.0,<3"
inputs = "0.5.*"
libusb = ">=1.0.30,<2"

[feature.ros1.tasks]
fetch-sources = "mkdir -p src/vendor && vcs import --recursive --skip-existing src/vendor < sources.repos"
build = { cmd = "bash tools/build_ros1.sh", depends-on = ["fetch-sources"] }

[feature.ros1.activation]
scripts = ["tools/activate_ros1.sh"]

[feature.ros1.activation.env]
TESTBED_WITH_FRANKA = "0"

[feature.ros1.pypi-dependencies]
tso-sensorium = { path = "../tso_sensorium", editable = true }
